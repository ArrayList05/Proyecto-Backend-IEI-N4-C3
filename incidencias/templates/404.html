<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada - 404</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #fdf2e9; text-align: center; padding: 50px; color: #2c3e50; }
        .error-container { background: white; max-width: 500px; margin: 0 auto; padding: 40px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        h1 { font-size: 80px; margin: 0; color: #e67e22; }
        h2 { margin-top: 10px; }
        p { color: #7f8c8d; }
        .btn { display: inline-block; margin-top: 20px; padding: 10px 20px; background-color: #27ae60; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; }
        .btn:hover { background-color: #219150; }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>404</h1>
        <h2>¡Ups! Ficha o registro no encontrado</h2>
        <p>La página o el historial clínico que buscas no existe en el sistema veterinario.</p>
        <a href="/" class="btn">Volver al Inicio</a>
    </div>
</body>
</html>
